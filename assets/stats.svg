<svg width="840" height="190" viewBox="0 0 840 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repository, language and streak stats">
<style>
  .card{fill:#0b1426;stroke:#1c2b4a;stroke-width:1;}
  .title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#e6f1ff;}
  .row-label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#7d8bb0;}
  .row-label-sm{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:10px;fill:#7d8bb0;}
  .row-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;fill:#e6f1ff;}
  .row-value-sm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#e6f1ff;}
  .sep{stroke:#1c2b4a;stroke-width:1;}
  .bar-track{fill:#1c2b4a;}
  .bar-fill{fill:#7c9cff;transform-box:fill-box;transform-origin:left;}
  .streak-num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:40px;font-weight:300;fill:#e6f1ff;}
  @media (prefers-color-scheme: light) {
    .card{fill:#f5f8ff;stroke:#d6e0f5;}
    .title{fill:#0b1426;}
    .row-label,.row-label-sm{fill:#5a6785;}
    .row-value,.row-value-sm,.streak-num{fill:#0b1426;}
    .sep{stroke:#d6e0f5;}
    .bar-track{fill:#d6e0f5;}
    .bar-fill{fill:#3b5bdb;}
  }
  @media (prefers-reduced-motion: no-preference) {
    .bar-fill{animation:grow 0.6s ease-out forwards;}
  }
  @keyframes grow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
</style>
