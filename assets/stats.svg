oke-dashoffset="-233.55" style="animation-delay:0.30s"/><circle cx="70" cy="118" r="42" class="donut-seg donut-seg-4" stroke-width="12" fill="none" stroke="var(--text)" opacity="0.26" stroke-dasharray="6.86 257.03" stroke-dashoffset="-245.42" style="animation-delay:0.40s"/></g><circle cx="150" cy="42" r="4" fill="var(--text)" opacity="0.92"/><text x="162" y="46" class="label sans">Python</text><text x="252" y="46" text-anchor="end" class="value-muted mono" style="font-size:11px">55.5%</text><circle cx="150" cy="66" r="4" fill="var(--text)" opacity="0.72"/><text x="162" y="70" class="label sans">TypeScr…</text><text x="252" y="70" text-anchor="end" class="value-muted mono" style="font-size:11px">25.8%</text><circle cx="150" cy="90" r="4" fill="var(--text)" opacity="0.55"/><text x="162" y="94" class="label sans">JavaScr…</text><text x="252" y="94" text-anchor="end" class="value-muted mono" style="font-size:11px">7.2%</text><circle cx="150" cy="114" r="4" fill="var(--text)" opacity="0.4"/><text x="162" y="118" class="label sans">Solidity</text><text x="252" y="118" text-anchor="end" class="value-muted mono" style="font-size:11px">4.5%</text><circle cx="150" cy="138" r="4" fill="var(--text)" opacity="0.26"/><text x="162" y="142" class="label sans">HTML</text><text x="252" y="142" text-anchor="end" class="value-muted mono" style="font-size:11px">2.6%</text></g><g transform="translate(568,0)"><rect x="0.5" y="0.5" width="271" height="189" rx="10" class="card"/><rect x="0.5" y="0.5" width="271" height="189" rx="10" filter="url(#grain)"/><text x="20" y="32" class="title sans">Streak</text>
<text x="136.0" y="92" text-anchor="middle" class="value mono" style="font-size:40px;font-weight:300">0</text>
<text x="136.0" y="112" text-anchor="middle" class="label sans">days in a row</text>
<text x="20" y="160" class="label-sm sans">Longest 3</text>
<text x="252" y="160" text-anchor="end" class="label-sm sans">Peak 63 a day</text>
</g>
</svg>