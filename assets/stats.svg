<svg width="840" height="190" viewBox="0 0 840 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repository, language and streak stats">
<style>

:root {
  --bg: #0a0a0a; --card: #111111; --border: #232323; --text: #ededed; --muted: #7a7a7a;
  --accent: #f5f5f5; --accent-soft: #4a4a4a;
  --heat0: #151515; --heat1: #2b2b2b; --heat2: #4d4d4d; --heat3: #8c8c8c; --heat4: #e8e8e8;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #fafafa; --card: #ffffff; --border: #e4e4e4; --text: #111111; --muted: #6b6b6b;
    --accent: #111111; --accent-soft: #b5b5b5;
    --heat0: #f0f0f0; --heat1: #d4d4d4; --heat2: #a3a3a3; --heat3: #5c5c5c; --heat4: #1a1a1a;
  }
}
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.card { fill: var(--card); stroke: var(--border); stroke-width: 1; }
.title { font-size: 13px; font-weight: 600; fill: var(--text); }
.label { font-size: 11px; fill: var(--muted); }
.label-sm { font-size: 10px; fill: var(--muted); }
.value { fill: var(--text); }
.value-muted { fill: var(--muted); }
.sep { stroke: var(--border); stroke-width: 1; }


.row-value { font-size: 18px; }
@media (prefers-reduced-motion: no-preference) {
  .donut-seg-0{animation:donutseg0 0.8s ease-out both;}
.donut-seg-1{animation:donutseg1 0.8s ease-out both;}
.donut-seg-2{animation:donutseg2 0.8s ease-out both;}
.donut-seg-3{animation:donutseg3 0.8s ease-out both;}
.donut-seg-4{animation:donutseg4 0.8s ease-out both;}
}
@keyframes donutseg0{from{stroke-dasharray:0 263.89;}to{stroke-dasharray:146.46 117.43;}}@keyframes donutseg1{from{stroke-dasharray:0 263.89;}to{stroke-dasharray:68.08 195.81;}}@keyframes donutseg2{from{stroke-dasharray:0 263.89;}to{stroke-dasharray:19.00 244.89;}}@keyframes donutseg3{from{stroke-dasharray:0 263.89;}to{stroke-dasharray:11.88 252.02;}}@keyframes donutseg4{from{stroke-dasharray:0 263.89;}to{stroke-dasharray:6.86 257.03;}}

</style>
<defs>
<filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.06 0"/>
</filter>

</defs>

